# Local development stack ONLY.
# Do NOT use this compose file as-is for a public portfolio deployment:
# it forces APP_ENV=development (which permits the placeholder JWT secret),
# publishes Postgres on the host, and uses a weak default DB password.
# For public deploy: set APP_ENV=production, DEBUG=false, strong JWT_SECRET
# and DB credentials via secrets, and do not expose Postgres publicly.
services:
  postgres:
    image: postgres:16
    container_name: eka-postgres
    environment:
      POSTGRES_DB: eka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eka"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eka-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/eka
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  backend_storage:
